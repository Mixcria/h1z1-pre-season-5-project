name: Community build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test server
        shell: pwsh
        run: dotnet test ./server/Cranberry.slnx -c Release
      - name: Test community updater
        shell: pwsh
        run: dotnet test ./tests/CommunityUpdater.Tests -c Release
      - name: Build offline community publisher
        shell: pwsh
        run: dotnet build ./tools/CommunityRelease -c Release --artifacts-path ./artifacts/publisher
      - name: Verify offline publisher fixtures
        shell: pwsh
        run: ./tools/CommunityRelease/Smoke-Publisher.ps1 -Publisher ./artifacts/publisher/bin/CommunityRelease/release/CommunityRelease.dll -Evidence ./artifacts/publisher-smoke
      - name: Build local package
        shell: pwsh
        run: ./Build-Local.ps1 -Output ./artifacts/Cranberry-Local -Zip
      - name: Verify isolated startup and persistence
        shell: pwsh
        run: dotnet run --project ./tests/LocalEdition.Smoke -c Release -- ./artifacts/Cranberry-Local ./artifacts/local-smoke
      - name: Verify updater handoff and rollback
        shell: pwsh
        run: dotnet run --project ./tests/CommunityUpdater.Smoke -c Release -- ./artifacts/Cranberry-Local ./artifacts/updater-smoke
      - name: Prepare signed GUI smoke fixtures
        shell: pwsh
        run: ./tools/CommunityRelease/Prepare-GuiSmoke.ps1 -Package ./artifacts/Cranberry-Local -Publisher ./artifacts/publisher/bin/CommunityRelease/release/CommunityRelease.dll -Evidence ./artifacts/gui-fixtures
      - name: Verify real launcher update and startup rollback
        shell: pwsh
        run: dotnet run --project ./tests/CommunityUpdater.GuiSmoke -c Release -- ./artifacts/gui-fixtures/seed ./artifacts/gui-fixtures/signed-good ./artifacts/gui-fixtures/signed-broken ./artifacts/gui-smoke
      - uses: actions/upload-artifact@v7
        with:
          name: Cranberry-Local-preview
          path: artifacts/Cranberry-Local.zip
          if-no-files-found: error
          retention-days: 14
